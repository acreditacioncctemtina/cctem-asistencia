<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asistencia CCTEM</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px 15px;
      margin: 0;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 5px;
    }

    #login, #scanner-container {
      max-width: 450px;
      margin: auto;
    }

    input {
      width: 90%;
      max-width: 300px;
      padding: 14px;
      font-size: 18px;
      margin: 15px 0;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: 25px auto 15px;
    }

    #zoom-container {
      display: none;
      margin: 10px auto 20px;
      max-width: 350px;
    }

    #zoom-container p {
      margin: 5px 0 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #zoom-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    #zoom-controls button {
      width: 50px;
      height: 45px;
      padding: 0;
      font-size: 25px;
      background: #222;
      color: white;
    }

    #zoom-value {
      min-width: 65px;
      font-size: 18px;
      font-weight: bold;
    }

    #zoom-slider {
      width: 85%;
      margin-top: 12px;
    }

    #resultado {
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div id="login">

    <h1>🔐 CCTEM</h1>

    <p>Acceso exclusivo para staff</p>

    <input
      type="password"
      id="clave"
      placeholder="Código de staff"
    >

    <br>

    <button onclick="entrar()">
      ENTRAR
    </button>

    <div id="mensaje"></div>

  </div>


  <div id="scanner-container" style="display:none">

    <h1>📷 Asistencia</h1>

    <p>Apunta al código de la credencial</p>

    <div id="reader"></div>

    <!-- CONTROL DE ZOOM -->
    <div id="zoom-container">

      <p>🔍 Zoom</p>

      <div id="zoom-controls">

        <button onclick="cambiarZoom(-0.5)">
          −
        </button>

        <span id="zoom-value">
          1.0×
        </span>

        <button onclick="cambiarZoom(0.5)">
          +
        </button>

      </div>

      <input
        type="range"
        id="zoom-slider"
        min="1"
        max="3"
        step="0.1"
        value="1"
        oninput="aplicarZoomDesdeSlider()"
      >

    </div>

    <div id="resultado"></div>

  </div>


<script>

const CLAVE = "DIVAOK";

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycby0nPZcKIbiyDBbzWi-tPX0AwnGsljuB04yflYGwyxa5oyPTQzAcFGDI5OGuyGFXmiLGg/exec";


let scanner = null;
let videoTrack = null;
let zoomActual = 1;


/* ==========================================
   LOGIN
   ========================================== */

function entrar() {

  const clave =
    document.getElementById("clave").value;

  if (clave !== CLAVE) {

    document.getElementById("mensaje").innerHTML =
      "❌ Código incorrecto";

    return;
  }

  localStorage.setItem(
    "cctem_staff",
    "autorizado"
  );

  iniciar();

}


/* ==========================================
   INICIAR SISTEMA
   ========================================== */

function iniciar() {

  document.getElementById("login").style.display =
    "none";

  document.getElementById("scanner-container").style.display =
    "block";

  iniciarScanner();

}


/* ==========================================
   INICIAR SCANNER
   ========================================== */

function iniciarScanner() {

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 15,

      qrbox: {
        width: 300,
        height: 180
      },

      videoConstraints: {
        facingMode: {
          ideal: "environment"
        }
      },

      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E
      ]

    },

    (decodedText) => {

      scanner.stop();

      document.getElementById("zoom-container").style.display =
        "none";

      registrar(decodedText);

    },

    () => {}

  ).then(() => {

    prepararZoom();

  }).catch((error) => {

    document.getElementById("resultado").innerHTML =
      "❌ No se pudo abrir la cámara.<br><br>" +
      "Revisa que Safari tenga permiso para usar la cámara.";

  });

}


/* ==========================================
   PREPARAR ZOOM
   ========================================== */

function prepararZoom() {

  const video =
    document.querySelector("#reader video");

  if (!video) {
    return;
  }

  const stream = video.srcObject;

  if (!stream) {
    return;
  }

  const tracks = stream.getVideoTracks();

  if (!tracks.length) {
    return;
  }

  videoTrack = tracks[0];

  const capabilities =
    videoTrack.getCapabilities();

  /*
   * Comprobamos si el dispositivo permite
   * controlar el zoom desde el navegador.
   */

  if (
    capabilities.zoom !== undefined
  ) {

    const minZoom =
      capabilities.zoom.min || 1;

    const maxZoom =
      Math.min(
        capabilities.zoom.max || 3,
        3
      );

    zoomActual = minZoom;

    const slider =
      document.getElementById("zoom-slider");

    slider.min = minZoom;
    slider.max = maxZoom;
    slider.step = 0.1;
    slider.value = minZoom;

    actualizarTextoZoom();

    document.getElementById("zoom-container").style.display =
      "block";

  }

}


/* ==========================================
   CAMBIAR ZOOM CON + / -
   ========================================== */

function cambiarZoom(cantidad) {

  if (!videoTrack) {
    return;
  }

  const capabilities =
    videoTrack.getCapabilities();

  if (capabilities.zoom === undefined) {

    document.getElementById("resultado").innerHTML =
      "⚠️ Este iPhone no permite controlar el zoom desde el navegador.";

    return;

  }

  const minZoom =
    capabilities.zoom.min || 1;

  const maxZoom =
    Math.min(
      capabilities.zoom.max || 3,
      3
    );

  zoomActual += cantidad;

  zoomActual =
    Math.max(
      minZoom,
      Math.min(maxZoom, zoomActual)
    );

  aplicarZoom();

}


/* ==========================================
   ZOOM DESDE SLIDER
   ========================================== */

function aplicarZoomDesdeSlider() {

  zoomActual =
    parseFloat(
      document.getElementById("zoom-slider").value
    );

  aplicarZoom();

}


/* ==========================================
   APLICAR ZOOM
   ========================================== */

async function aplicarZoom() {

  if (!videoTrack) {
    return;
  }

  try {

    await videoTrack.applyConstraints({

      advanced: [
        {
          zoom: zoomActual
        }
      ]

    });

    actualizarTextoZoom();

  } catch (error) {

    document.getElementById("resultado").innerHTML =
      "⚠️ No se pudo cambiar el zoom.";

  }

}


/* ==========================================
   ACTUALIZAR TEXTO
   ========================================== */

function actualizarTextoZoom() {

  document.getElementById("zoom-value").innerText =
    zoomActual.toFixed(1) + "×";

  document.getElementById("zoom-slider").value =
    zoomActual;

}


/* ==========================================
   REGISTRAR CÓDIGO
   ========================================== */

function registrar(codigoLeido) {

  let rut = codigoLeido.trim();


  /*
   * Si es un QR, contiene nuestra URL.
   * Extraemos el RUT.
   */

  try {

    const url = new URL(codigoLeido);

    const rutQR =
      url.searchParams.get("rut");

    if (rutQR) {
      rut = rutQR;
    }

  } catch (error) {

    /*
     * Si no es una URL, asumimos que es
     * un código de barras que contiene el RUT.
     */

  }


  if (!rut) {

    document.getElementById("resultado").innerHTML =
      "❌ No se pudo leer el RUT";

    setTimeout(reiniciar, 2000);

    return;

  }


  const urlRegistro =
    SCRIPT_URL +
    "?rut=" +
    encodeURIComponent(rut);


  window.location.href = urlRegistro;

}


/* ==========================================
   REINICIAR SCANNER
   ========================================== */

function reiniciar() {

  document.getElementById("resultado").innerHTML = "";

  iniciarScanner();

}


/* ==========================================
   MANTENER LOGIN
   ========================================== */

window.onload = function() {

  if (
    localStorage.getItem("cctem_staff")
    === "autorizado"
  ) {

    iniciar();

  }

};

</script>

</body>
</html>
