<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asistencia CCTEM</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px 15px;
      margin: 0;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 5px;
    }

    #login, #scanner-container {
      max-width: 450px;
      margin: auto;
    }

    input {
      width: 90%;
      max-width: 300px;
      padding: 14px;
      font-size: 18px;
      margin: 15px 0;
      box-sizing: border-box;
    }

    button {
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: 25px auto 15px;
    }

    #boton-enfocar {
      display: none;
      margin: 10px auto 20px;
      font-size: 18px;
      background: #222;
      color: white;
      width: 90%;
      max-width: 300px;
    }

    #resultado {
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div id="login">

    <h1>🔐 CCTEM</h1>

    <p>Acceso exclusivo para staff</p>

    <input
      type="password"
      id="clave"
      placeholder="Código de staff"
    >

    <br>

    <button onclick="entrar()">
      ENTRAR
    </button>

    <div id="mensaje"></div>

  </div>


  <div id="scanner-container" style="display:none">

    <h1>📷 Asistencia</h1>

    <p>Apunta al código de la credencial</p>

    <div id="reader"></div>

    <button
      id="boton-enfocar"
      onclick="enfocarCamara()"
    >
      🔍 ENFOCAR
    </button>

    <div id="resultado"></div>

  </div>


<script>

const CLAVE = "DIVAOK";

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycby0nPZcKIbiyDBbzWi-tPX0AwnGsljuB04yflYGwyxa5oyPTQzAcFGDI5OGuyGFXmiLGg/exec";

let scanner = null;


/* ==========================================
   LOGIN
   ========================================== */

function entrar() {

  const clave =
    document.getElementById("clave").value;

  if (clave !== CLAVE) {

    document.getElementById("mensaje").innerHTML =
      "❌ Código incorrecto";

    return;
  }

  localStorage.setItem(
    "cctem_staff",
    "autorizado"
  );

  iniciar();

}


/* ==========================================
   INICIAR SISTEMA
   ========================================== */

function iniciar() {

  document.getElementById("login").style.display =
    "none";

  document.getElementById("scanner-container").style.display =
    "block";

  iniciarScanner();

}


/* ==========================================
   INICIAR SCANNER
   ========================================== */

function iniciarScanner() {

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 15,

      qrbox: {
        width: 300,
        height: 180
      },

      videoConstraints: {
        facingMode: {
          ideal: "environment"
        }
      },

      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E
      ]

    },

    (decodedText) => {

      scanner.stop();

      document.getElementById("boton-enfocar").style.display =
        "none";

      registrar(decodedText);

    },

    () => {}

  ).then(() => {

    /*
     * Mostramos el botón una vez que
     * la cámara ya está funcionando.
     */
    document.getElementById("boton-enfocar").style.display =
      "block";

  }).catch((error) => {

    document.getElementById("resultado").innerHTML =
      "❌ No se pudo abrir la cámara.<br><br>" +
      "Revisa que Safari tenga permiso para usar la cámara.";

  });

}


/* ==========================================
   BOTÓN ENFOCAR
   ========================================== */

async function enfocarCamara() {

  try {

    /*
     * Buscamos el video que está utilizando
     * html5-qrcode.
     */
    const video =
      document.querySelector("#reader video");

    if (!video) {

      document.getElementById("resultado").innerHTML =
        "⚠️ La cámara todavía no está lista.";

      return;

    }


    /*
     * Obtenemos la pista de video de la cámara.
     */
    const stream = video.srcObject;

    if (!stream) {

      document.getElementById("resultado").innerHTML =
        "⚠️ No se pudo acceder a la cámara.";

      return;

    }


    const tracks = stream.getVideoTracks();

    if (!tracks.length) {

      document.getElementById("resultado").innerHTML =
        "⚠️ No se encontró la cámara.";

      return;

    }


    const track = tracks[0];


    /*
     * Pedimos enfoque puntual.
     */
    await track.applyConstraints({

      advanced: [
        {
          focusMode: "single-shot"
        }
      ]

    });


    document.getElementById("resultado").innerHTML =
      "🔍 Enfoque realizado. Apunta al código.";


    /*
     * Quitamos el mensaje después de un momento.
     */
    setTimeout(() => {

      document.getElementById("resultado").innerHTML = "";

    }, 1500);


  } catch (error) {

    /*
     * Algunos teléfonos/navegadores no permiten
     * controlar el enfoque desde una página web.
     */
    document.getElementById("resultado").innerHTML =
      "⚠️ Este teléfono no permite controlar el enfoque desde el navegador.<br>" +
      "Acerca o aleja un poco la cámara.";

  }

}


/* ==========================================
   REGISTRAR CÓDIGO
   ========================================== */

function registrar(codigoLeido) {

  let rut = codigoLeido.trim();


  /*
   * Si es un QR, contiene nuestra URL.
   * Extraemos el RUT.
   */

  try {

    const url = new URL(codigoLeido);

    const rutQR =
      url.searchParams.get("rut");

    if (rutQR) {
      rut = rutQR;
    }

  } catch (error) {

    /*
     * Si no es una URL, asumimos que es
     * un código de barras que contiene el RUT.
     */

  }


  if (!rut) {

    document.getElementById("resultado").innerHTML =
      "❌ No se pudo leer el RUT";

    setTimeout(reiniciar, 2000);

    return;

  }


  const urlRegistro =
    SCRIPT_URL +
    "?rut=" +
    encodeURIComponent(rut);


  window.location.href = urlRegistro;

}


/* ==========================================
   REINICIAR SCANNER
   ========================================== */

function reiniciar() {

  document.getElementById("resultado").innerHTML = "";

  iniciarScanner();

}


/* ==========================================
   MANTENER LOGIN
   ========================================== */

window.onload = function() {

  if (
    localStorage.getItem("cctem_staff")
    === "autorizado"
  ) {

    iniciar();

  }

};

</script>

</body>
</html>
